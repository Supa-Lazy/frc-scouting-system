{% extends "admin/base_site.html" %}
{% block content %}
<div style="padding: 20px; font-family: sans-serif;">
    <h2 style="color: #dc3545;">Hour Adjustment Tool</h2>
    <p>Applying changes to <strong>{{ items.count }}</strong> selected members.</p>
    
    <form action="" method="post" style="background: #f8f9fa; padding: 30px; border-radius: 15px; border: 1px solid #dee2e6;">
        {% csrf_token %}
        {% for item in items %}
            <input type="hidden" name="_selected_action" value="{{ item.pk }}" />
        {% endfor %}

        <div style="margin-bottom: 20px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Hours to Add (or Subtract with -):</label>
            <input type="number" step="0.1" name="adjustment_amount" placeholder="e.g. 5.5 or -2" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;" required>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Reason for change:</label>
            <input type="text" name="adjustment_note" placeholder="e.g. Outreach Event" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;">
        </div>

        <input type="hidden" name="action" value="adjust_hours" />
        <input type="submit" name="apply" value="Confirm Changes" style="background:#dc3545; color:white; border:none; padding:12px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">
        <a href="." style="margin-left: 15px; text-decoration:none; color:#666;">Cancel</a>
    </form>
</div>
{% endblock %}
