{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Admin Management</h5>
    </div>
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Member</th>
                    <th>Total Time (Formatted)</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in users %}
                <tr>
                    <td class="fw-bold">
                        <a href="{% url 'hours:user_detail' entry.user__id %}">{{ entry.user__username }}</a>
                    </td>
                    <td>{{ entry.total_time|default:"0:00" }}</td>
                    <td class="text-end">
                        <form method="post" class="d-inline-flex gap-2">
                            {% csrf_token %}
                            <input type="hidden" name="user_id" value="{{ entry.user__id }}">
                            <input type="number" name="extra_time" class="form-control form-control-sm" style="width: 100px;" placeholder="Seconds">
                            <button type="submit" name="action" value="add_time" class="btn btn-sm btn-primary">Add Time</button>
                            <button type="submit" name="action" value="remove_user" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete all sessions for this user?')">Clear All</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
