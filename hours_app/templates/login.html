{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    ...
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Eagleforce Robotics</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            max-width: 380px;
            width: 100%;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #dc3545; /* Eagleforce red */
            margin-bottom: 0.25rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .btn-google {
            background-color: #dc3545;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 12px;
            transition: all 0.2s;
        }

        .btn-google:hover {
            background-color: #b02a37;
            color: #fff;
        }

        .alert {
            font-size: 0.85rem;
            padding: 10px 12px;
        }

        .logo {
            max-width: 100px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Eagleforce logo -->
        <img src="{% static 'images/eagleforce_logo.png' %}" alt="Eagleforce Robotics Logo" class="logo">

        <div class="login-title">Eagleforce Robotics</div>
        <div class="login-subtitle">Sign in with your team Google account</div>

        <!-- Google Sign-In Button -->
        <a href="{% provider_login_url 'google' %}?process=login" class="btn btn-google w-100 mb-3">
            <i class="fab fa-google me-2"></i> Sign in with Google
        </a>

        <!-- Messages -->
        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

</body>
</html>
